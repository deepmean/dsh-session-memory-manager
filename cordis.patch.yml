# Cold-start replacement only. Do not enable this bundle through HMR in a running Host.
# Keep the Web native row enabled for its Client and Typert sidecars. On the
# supported path, one optional warning about its pending standby is expected.
- id: session-controller
  name: '@deepseek-ai/dsh-api-session-controller'
  inject: [dshSessionMemoryNativeFallback]
- id: session-persistence-jsonl
  disabled: true
- id: agent-loop
  disabled: true
- id: session-query-sqlite
  disabled: true
- insert:
    - id: session-memory-controller
      name: '@local/dsh-session-memory-manager/session-controller'
      config:
        idleReclaimMinutes: 5
    - id: ptc-disk-history-persistence
      name: '@local/dsh-session-memory-manager/persistence'
      config:
        root: !!js dshHomePath('sessions')
        compression: zstd
        listConcurrency: 3
        workerHeapMiB: 192
        requestTimeoutMs: 90000
        maxFrameMiB: 64
        previewBytes: 4096
        thresholdBytes: 32768
    - id: ptc-disk-history-agent-loop
      name: '@local/dsh-session-memory-manager/agent-loop'
      inject: ['sessionPersistence']
      config:
        agents: []
    - id: ptc-disk-history-query
      name: '@local/dsh-session-memory-manager/query'
      inject: ['sessionPersistence']
      config:
        path: ':memory:'
        openAt: never
        preparedSessionCacheSize: 1
    - id: ptc-disk-history-tool
      name: '@local/dsh-session-memory-manager/tool'
    - id: ptc-disk-history
      name: '@local/dsh-session-memory-manager'
